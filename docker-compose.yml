services:
  postgres:
    image: postgres:16-alpine
    container_name: finova-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finova}
      POSTGRES_USER: ${POSTGRES_USER:-finova_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - finova_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finova_user} -d ${POSTGRES_DB:-finova}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  finova_pgdata:
